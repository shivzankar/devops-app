apiVersion: apps/v1
kind: Deployment
metadata: { name: devops-app }
spec:
  replicas: 2
  selector: { matchLabels: { app: devops-app } }
  template:
    metadata: { labels: { app: devops-app } }
    spec:
      containers:
      - name: devops-app
        image: IMAGE_PLACEHOLDER
        ports: [{ containerPort: 5000 }]
        readinessProbe: { httpGet: { path: /health, port: 5000 } }
---
apiVersion: v1
kind: Service
metadata: { name: devops-app-svc }
spec:
  type: NodePort
  selector: { app: devops-app }
  ports: [{ port: 80, targetPort: 5000, nodePort: 30080 }]
